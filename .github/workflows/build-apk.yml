name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'both'
        type: choice
        options: [ debug, release, both ]

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

defaults:
  run:
    working-directory: btc-swing-simulator

jobs:
  build:
    name: Testes + APK (${{ github.event.inputs.build_type || 'both' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Rodar testes unitários (indicadores, estratégia, simulação, relatório)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Montar APK debug
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type != 'release' }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar keystore de release (opcional, via secrets)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type != 'debug' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.keystore
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
            echo "Keystore de release decodificado."
          else
            echo "Sem secrets de keystore — release será assinado com chave debug (instalável normalmente)."
          fi

      - name: Montar APK release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type != 'debug' }}
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Coletar e renomear APKs
        run: |
          mkdir -p dist
          for f in $(find app/build/outputs/apk -name '*.apk' | sort); do
            flavor=$(echo "$f" | grep -oE '(debug|release)' | head -1)
            short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
            out="dist/BtcSwingSimulator-${flavor}-${short_sha}-arm64.apk"
            cp "$f" "$out"
            echo "Gerado: $out ($(du -h "$out" | cut -f1))"
          done
          ls -lh dist/

      - name: Enviar APKs como artifact (download na aba do workflow)
        uses: actions/upload-artifact@v4
        with:
          name: apk-xiaomi-12t-pro
          path: btc-swing-simulator/dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Criar Release no GitHub (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: btc-swing-simulator/dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
